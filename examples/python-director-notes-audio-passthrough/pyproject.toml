[project]
name = "python-director-notes-audio-passthrough"
version = "0.1.0"
description = "Anam audio passthrough with synced Director Notes cues"
requires-python = ">=3.10"
dependencies = [
    "anam>=0.8.0",            # first stable release with Director Notes cues
    "cartesia>=3.3.0",
    "opencv-python>=4.9.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
